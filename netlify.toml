# wynter.ai — Netlify configuration.
#
# There is no build step: the repository root *is* the site. Netlify serves
# `about.html` at `/about` and redirects the `.html` URL to the clean one on its
# own, which is why every internal link here is extensionless.

[build]
  publish = "."
  command = ""

[build.processing]
  skip_processing = false

[build.processing.html]
  pretty_urls = true

# --- canonical host ---------------------------------------------------------
# One address for the site, so links and analytics don't split across two.
# Change this pair if the apex ever moves to www rather than the other way.

[[redirects]]
  from = "https://www.wynter.ai/*"
  to = "https://wynter.ai/:splat"
  status = 301
  force = true

# Old paths worth catching rather than 404ing.
# Both go through the hosted lead page, so a typed-in shortcut converts the
# same way a click from the home page does.
[[redirects]]
  from = "/signup"
  to = "https://account.wynter.ai/join/wynter-ai"
  status = 302
  force = true

[[redirects]]
  from = "/join"
  to = "https://account.wynter.ai/join/wynter-ai"
  status = 302
  force = true

[[redirects]]
  from = "/login"
  to = "https://account.wynter.ai/login"
  status = 302
  force = true

[[redirects]]
  from = "/tos"
  to = "/terms"
  status = 301

# --- headers ----------------------------------------------------------------

[[headers]]
  for = "/*"

  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=(), interest-cohort=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"

    # No 'unsafe-inline' anywhere: every script lives in /site.js and every rule
    # in /styles.css, precisely so this can stay strict.
    #
    # form-action names the account platform because the home page signup form
    # posts there — without it the browser blocks the submit and the funnel is
    # dead. It is deliberately the ONLY allowance: script-src and connect-src
    # stay closed, so nothing here can execute or exfiltrate to another origin,
    # which is what makes a password field on this site defensible.
    Content-Security-Policy = """\
default-src 'self'; \
script-src 'self'; \
style-src 'self' https://fonts.googleapis.com; \
font-src 'self' https://fonts.gstatic.com; \
img-src 'self' data:; \
connect-src 'self'; \
form-action 'self' https://account.wynter.ai; \
frame-ancestors 'none'; \
base-uri 'self'; \
object-src 'none'; \
upgrade-insecure-requests"""

# Fingerprint-free filenames, so HTML must revalidate or a stale page pins a
# stale stylesheet.
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# Same reasoning one level down: CSS and JS change with the site, so an hour is
# long enough to help repeat visits and short enough that a fix lands the day
# it ships.
[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "public, max-age=3600, must-revalidate"

[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=3600, must-revalidate"

# Logos and icons are stable — if one changes, it changes filename.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
