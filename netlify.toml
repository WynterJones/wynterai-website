# wynter.ai — Netlify configuration.
#
# There is no build step: the repository root *is* the site. Netlify serves
# `about.html` at `/about` and redirects the `.html` URL to the clean one on its
# own, which is why every internal link here is extensionless.

[build]
  publish = "."
  command = ""

[build.processing]
  skip_processing = false

[build.processing.html]
  pretty_urls = true

# --- canonical host ---------------------------------------------------------
# One address for the site, so links and analytics don't split across two.
# Change this pair if the apex ever moves to www rather than the other way.

[[redirects]]
  from = "https://www.wynter.ai/*"
  to = "https://wynter.ai/:splat"
  status = 301
  force = true

# --- retired paths ----------------------------------------------------------
#
# /pace/ used to be the framework page; the home page is now that page, so the
# two are the same document and only one of them should be indexable.
#
# EXACT paths, never "/pace/*". A splat here would swallow /pace/protocol/ and
# /pace/guide/, which are live pages and the two most linked things on the site.
# Netlify matches redirects top-down and stops at the first hit, so these also
# sit above nothing that could shadow them — but the exactness is what actually
# protects the children, not the ordering.
[[redirects]]
  from = "/pace"
  to = "/"
  status = 301

[[redirects]]
  from = "/pace/"
  to = "/"
  status = 301

# Typed-in shortcut. It lands on the signup page rather than on the account
# platform: /start is a POST endpoint, and the form that posts to it lives here.
#
# There is no rule for `/signup` any more — it is a real page at /signup/, and
# `force = true` on a redirect would shadow the document it now points at.
[[redirects]]
  from = "/join"
  to = "/signup/"
  status = 301
  force = true

[[redirects]]
  from = "/login"
  to = "https://account.wynter.ai/login"
  status = 302
  force = true

[[redirects]]
  from = "/tos"
  to = "/terms"
  status = 301

# --- headers ----------------------------------------------------------------

[[headers]]
  for = "/*"

  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=(), interest-cohort=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"

    # No 'unsafe-inline' anywhere: every script lives in /site.js and every rule
    # in /styles.css, precisely so this can stay strict.
    #
    # form-action names the account platform because the signup form at
    # /signup/ posts there — without it the browser blocks the submit and the
    # funnel is dead. That form is a plain <form method="post">, so this is load
    # bearing in production and there is no JavaScript fallback if it is
    # removed. It is deliberately the ONLY allowance: script-src and connect-src
    # stay closed, so nothing here can execute or exfiltrate to another origin.
    Content-Security-Policy = """\
default-src 'self'; \
script-src 'self'; \
style-src 'self' https://fonts.googleapis.com; \
font-src 'self' https://fonts.gstatic.com; \
img-src 'self' data:; \
connect-src 'self'; \
form-action 'self' https://account.wynter.ai; \
frame-ancestors 'none'; \
base-uri 'self'; \
object-src 'none'; \
upgrade-insecure-requests"""

# Fingerprint-free filenames, so HTML must revalidate or a stale page pins a
# stale stylesheet.
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# Same reasoning one level down: CSS and JS change with the site, so an hour is
# long enough to help repeat visits and short enough that a fix lands the day
# it ships.
[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "public, max-age=3600, must-revalidate"

[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=3600, must-revalidate"

# Logos and icons are stable — if one changes, it changes filename.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# The PDF build source. It is the same words as /pace/guide/, laid out for a
# printer — page plates, hard page breaks, no navigation — so in a browser it
# looks broken, and in an index it competes with the page it was built from.
# Netlify merges header rules, so this adds to the /* block rather than
# replacing it. Nothing links here; the header is the belt to that braces, and
# print.html carries a <meta name="robots"> as well.
#
# BOTH paths, because pretty_urls is on: a crawler that finds `print.html` gets
# 301'd to the extensionless form, and a rule written only for the `.html` URL
# would not be attached to the page that actually gets indexed.
[[headers]]
  for = "/pace/guide/print.html"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

[[headers]]
  for = "/pace/guide/print"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
